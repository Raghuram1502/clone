{% extends 'core/base.html' %}
{% block content %}
  <form method="post" enctype="multipart/form-data" action="{% url 'create_post' %}">
    {% csrf_token %}
    <input type="file" name="image" required>
    <input type="text" name="caption" placeholder="Caption" required>
    <button type="submit">Post</button>
  </form>

  {% for post in posts %}
    <div class="post">
      <img src="{{ post.image.url }}" alt="Post image" width="300">
      <p>{{ post.caption }}</p>
      <form action="{% url 'like_post' post.id %}" method="post">
        {% csrf_token %}
        <button>{{ post.total_likes }} Likes</button>
      </form>

      <form action="{% url 'add_comment' post.id %}" method="post">
        {% csrf_token %}
        <input type="text" name="body" placeholder="Add a comment">
        <button type="submit">Comment</button>
      </form>
      <ul>
        {% for comment in post.comments.all %}
          <li><strong>{{ comment.user.username }}</strong>: {{ comment.body }}</li>
        {% endfor %}
      </ul>
    </div>
  {% endfor %}
  
{% endblock %}
